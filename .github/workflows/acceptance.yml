name: FilmOS Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - acceptance/**
      - backend/**
      - canvas-agent/**
      - desktop/**
      - film-contracts/**
      - film-core/**
      - packages/filmos-tool-contracts/**
      - scripts/**
      - services/filmos-chatgpt-app/**
      - web/**
      - .github/workflows/acceptance.yml
  push:
    branches:
      - integration
      - main
    tags:
      - filmos-v1.0.0-rc*

permissions:
  contents: read

jobs:
  rc-local:
    name: Reproducible Local Acceptance
    runs-on: macos-14
    timeout-minutes: 90
    env:
      FILMOS_DESKTOP_SWIFT_VERSION: "6.0.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/filmos-tool-contracts/package-lock.json
            services/filmos-chatgpt-app/package-lock.json

      # Package.swift and the Desktop test target use the Swift 6 toolchain and
      # Swift Testing. Pin the same compiler used by the formal unsigned app build.
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: ${{ env.FILMOS_DESKTOP_SWIFT_VERSION }}

      - name: Establish formal Desktop Swift and Apple C toolchains
        shell: bash
        run: |
          set -euo pipefail
          swift --version

          apple_cc="$(TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --find clang)"
          apple_cxx="$(TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --find clang++)"
          macos_sdk="$(TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --show-sdk-path)"
          test -x "$apple_cc"
          test -x "$apple_cxx"
          test -d "$macos_sdk"

          probe_source="$(mktemp "${RUNNER_TEMP}/filmos-c-toolchain.XXXXXX")"
          probe_object="${probe_source}.o"
          trap 'rm -f "$probe_source" "$probe_object"' EXIT
          printf '#include <stdlib.h>\nint filmos_c_toolchain_probe(void) { return EXIT_SUCCESS; }\n' > "$probe_source"
          "$apple_cc" -isysroot "$macos_sdk" -x c -c "$probe_source" -o "$probe_object"

          {
            echo "CC=$apple_cc"
            echo "CXX=$apple_cxx"
            echo "SDKROOT=$macos_sdk"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run clean Local-first acceptance
        env:
          FILMOS_ACCEPTANCE_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: acceptance/run_all

      - name: Upload original machine evidence and Release Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmos-acceptance-${{ github.sha }}
          path: .local/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30
