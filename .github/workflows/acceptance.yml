name: FilmOS Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - acceptance/**
      - backend/**
      - canvas-agent/**
      - desktop/**
      - film-contracts/**
      - film-core/**
      - packages/filmos-tool-contracts/**
      - scripts/**
      - services/filmos-chatgpt-app/**
      - web/**
      - .github/workflows/acceptance.yml
  push:
    branches:
      - integration
      - main
    tags:
      - filmos-v1.0.0-rc*

permissions:
  contents: read

jobs:
  rc-local:
    name: Reproducible Local Acceptance
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/filmos-tool-contracts/package-lock.json
            services/filmos-chatgpt-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Run clean Local-first acceptance
        env:
          FILMOS_ACCEPTANCE_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: acceptance/run_all

      - name: Upload original machine evidence and Release Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmos-acceptance-${{ github.sha }}
          path: .local/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30
