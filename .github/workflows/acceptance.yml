name: FilmOS Acceptance

on:
  workflow_dispatch:
    inputs:
      authorize_app_acceptance:
        description: Explicit user authorization to build an App (never enable for ordinary source development)
        required: false
        default: false
        type: boolean
      live_trace_base64:
        description: Optional base64 V1.1 external Live Trace; required only for final operational Handoff
        required: false
        type: string
      live_trace_sha256:
        description: Required SHA-256 when live_trace_base64 is supplied
        required: false
        type: string
  pull_request:
    paths:
      - acceptance/**
      - backend/**
      - canvas-agent/**
      - cli/filmos-review/**
      - desktop/**
      - extensions/filmos-review-bridge/**
      - film-contracts/**
      - film-core/**
      - governance/**
      - implementation/use-driven-dual-expert-v1-1/**
      - packages/filmos-tool-contracts/**
      - packages/filmos-agent-contracts/**
      - packages/filmos-agent-tool-contracts/**
      - packages/filmos-generation-contracts/**
      - packages/filmos-review-contract/**
      - scripts/**
      - services/filmos-chatgpt-app/**
      - services/filmos-review-bus/**
      - web/**
      - .github/workflows/acceptance.yml
      - AGENTS.md
      - docs/content/docs/backend/local-development.mdx
  push:
    branches:
      - integration
      - main
    tags:
      - filmos-v1.0.0-rc*

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: SOURCE_VALIDATION (no App or live services)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Bind source C/Swift toolchain (no App build)
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          echo "CC=$(xcrun --sdk macosx --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --sdk macosx --find clang++)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Bind actual diff range and reject ambiguous live inputs
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          LIVE_TRACE: ${{ inputs.live_trace_base64 }}
          APP_AUTHORIZED: ${{ inputs.authorize_app_acceptance }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$LIVE_TRACE" ] && [ "$APP_AUTHORIZED" != "true" ]; then
            echo "Live trace belongs to separately authorized App/external acceptance" >&2
            exit 2
          fi
          if [ -n "$PR_BASE" ]; then
            diff_base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            diff_base=$(git rev-parse --verify "$EVENT_BEFORE^{commit}")
          else
            diff_base=$(git rev-parse --verify HEAD^)
          fi
          echo "FILMOS_DIFF_BASE=$diff_base" >> "$GITHUB_ENV"
          echo "FILMOS_DIFF_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare locked source dependencies (no App build)
        run: acceptance/bootstrap
      - name: Run fixture-only source validation
        run: .local/acceptance-venv/bin/python acceptance/run.py --suite source --evidence-root .local/source-validation
      - name: Upload SOURCE_VALIDATION evidence (not release or live acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmos-source-validation-${{ github.sha }}
          path: .local/source-validation/
          if-no-files-found: error
          retention-days: 30

  rc-local:
    name: APP_ACCEPTANCE (explicit packaging authorization)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_app_acceptance == true }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FILMOS_XCODE_PRODUCT_VERSION: "26.6"
      FILMOS_XCODE_BUILD: "17F113"
      FILMOS_DESKTOP_SWIFT_VERSION: "6.3.3"
      FILMOS_SWIFT_TARGET: "arm64-apple-macosx26.0"
      FILMOS_MACOS_SDK_VERSION: "26.5"
      FILMOS_MACOS_SDK_BUILD: "25F70"
      FILMOS_XCODE_DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
      FILMOS_RUNNER_IMAGE: "macos-26"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: npm
          cache-dependency-path: |
            packages/filmos-agent-tool-contracts/package-lock.json
            packages/filmos-generation-contracts/package-lock.json
            packages/filmos-tool-contracts/package-lock.json
            services/filmos-chatgpt-app/package-lock.json

      - name: Establish formal Xcode, Swift Testing and Apple C toolchains
        shell: bash
        run: |
          set -euo pipefail
          test -d "$FILMOS_XCODE_DEVELOPER_DIR"
          DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" /usr/bin/xcodebuild -version
          DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" /usr/bin/xcrun swift --version
          DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" python3 acceptance/swift_toolchain.py

          apple_cc="$(DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --find clang)"
          apple_cxx="$(DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --find clang++)"
          macos_sdk="$(DEVELOPER_DIR="$FILMOS_XCODE_DEVELOPER_DIR" TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault /usr/bin/xcrun --sdk macosx --show-sdk-path)"
          test -x "$apple_cc"
          test -x "$apple_cxx"
          test -d "$macos_sdk"

          probe_source="$(mktemp "${RUNNER_TEMP}/filmos-c-toolchain.XXXXXX")"
          probe_object="${probe_source}.o"
          trap 'rm -f "$probe_source" "$probe_object"' EXIT
          printf '#include <stdlib.h>\nint filmos_c_toolchain_probe(void) { return EXIT_SUCCESS; }\n' > "$probe_source"
          "$apple_cc" -isysroot "$macos_sdk" -x c -c "$probe_source" -o "$probe_object"

          {
            echo "CC=$apple_cc"
            echo "CXX=$apple_cxx"
            echo "SDKROOT=$macos_sdk"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Decode and verify optional external Live Trace
        if: ${{ inputs.live_trace_base64 != '' }}
        env:
          FILMOS_LIVE_TRACE_BASE64: ${{ inputs.live_trace_base64 }}
          FILMOS_LIVE_TRACE_SHA256: ${{ inputs.live_trace_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          trace_path="$RUNNER_TEMP/V1_1_DUAL_EXPERT_LIVE_ROUNDTRIP_TRACE.json"
          python3 - "$trace_path" <<'PY'
          import base64, hashlib, os, pathlib, sys
          expected = os.environ.get("FILMOS_LIVE_TRACE_SHA256", "")
          if len(expected) != 64:
              raise SystemExit("live_trace_sha256 is required and must be 64 hex characters")
          data = base64.b64decode(os.environ["FILMOS_LIVE_TRACE_BASE64"], validate=True)
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("external Live Trace SHA-256 mismatch")
          pathlib.Path(sys.argv[1]).write_bytes(data)
          PY
          echo "FILMOS_V1_1_EXTERNAL_LIVE_TRACE=$trace_path" >> "$GITHUB_ENV"

      - name: Run clean Local-first acceptance
        env:
          FILMOS_ACCEPTANCE_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export FILMOS_DIFF_BASE="$(git rev-parse HEAD^)"
          export FILMOS_DIFF_HEAD="$(git rev-parse HEAD)"
          acceptance/run_all --authorize-app-acceptance

      - name: Upload original machine evidence and Release Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmos-acceptance-${{ github.sha }}
          path: .local/acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30
